<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev App - Core Chat</title>
    <!-- 1. Upgrade Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- 3. Form Elements (Icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="../CSS/style.css">
    <style>
        .chat-message.llm p:first-child,
        .chat-message.llm ul:first-child,
        .chat-message.llm ol:first-child {
            margin-top: 0;
        }

        .chat-message.llm p:last-child,
        .chat-message.llm ul:last-child,
        .chat-message.llm ol:last-child {
            margin-bottom: 0;
        }

        .chat-message.llm li {
            margin-bottom: 4px;
        }
    </style>
</head>

<body>
    <!-- 2. Depth & Background -->
    <div class="bg-gradient"></div>
    <div class="container chat-container">
        <h1>AI Assistant</h1>

        <div class="chat-box">
            <div class="chat-messages" id="chatMessages">
                <div class="chat-message llm">
                    Hello! I'm your AI assistant. The LLM port is ready. How can I help you today?
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Type your message..." autocomplete="off">
                <button class="btn btn-send" id="sendBtn">
                    <i class="ph ph-paper-plane-right"></i>
                </button>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const chatMessages = document.getElementById("chatMessages");
            const chatInput = document.getElementById("chatInput");
            const sendBtn = document.getElementById("sendBtn");

            // Utility to add a message to the UI
            const appendMessage = (text, sender) => {
                const msgDiv = document.createElement("div");
                msgDiv.className = `chat-message ${sender}`;
                if (sender === "llm") {
                    msgDiv.innerHTML = marked.parse(text);
                } else {
                    msgDiv.textContent = text;
                }
                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight; // Auto-scroll
            };

            // Utility to add a typing indicator
            const showTypingIndicator = () => {
                const indicatorDiv = document.createElement("div");
                indicatorDiv.className = "chat-message llm typing";
                indicatorDiv.id = "typingIndicator";
                indicatorDiv.innerHTML = `
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                `;
                chatMessages.appendChild(indicatorDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            };

            // Remove typing indicator
            const removeTypingIndicator = () => {
                const indicator = document.getElementById("typingIndicator");
                if (indicator) indicator.remove();
            };

            // Generate or retrieve a session ID
            let sessionId = localStorage.getItem('chatId');
            if (!sessionId) {
                sessionId = crypto.randomUUID();
                localStorage.setItem('chatId', sessionId);
            }

            // PORT FOR LLM: Function to handle sending message to LLM
            const sendToLLM = async (userMessage) => {
                showTypingIndicator();

                // 120 second timeout for AI responses (tool-calling chains can be slow)
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 120000);

                try {
                    const response = await fetch('http://localhost:8000/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: userMessage, session_id: sessionId }),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    const data = await response.json();
                    removeTypingIndicator();

                    let aiResponse = data.reply || data.error || "No response received.";

                    if (aiResponse.includes("Redirected user to signup page") || aiResponse.includes("[ACTION_REQUIRED: SIGNUP]")) {
                        window.location.href = `index.html?chatid=${sessionId}`;
                    } else {
                        appendMessage(aiResponse, "llm");
                    }
                } catch (error) {
                    clearTimeout(timeoutId);
                    removeTypingIndicator();
                    if (error.name === 'AbortError') {
                        appendMessage("The request timed out. The AI is taking longer than expected. Please try again.", "llm");
                    } else {
                        appendMessage("Sorry, I encountered an error connecting to the AI server. Is the backend running?", "llm");
                    }
                }
            };

            // Handle send action
            const handleSend = () => {
                const text = chatInput.value.trim();
                if (!text) return;

                appendMessage(text, "user");
                chatInput.value = ""; // Clear input

                // Disable input while waiting to prevent multiple requests
                chatInput.disabled = true;
                sendBtn.disabled = true;

                // Send to the LLM port
                sendToLLM(text).finally(() => {
                    chatInput.disabled = false;
                    sendBtn.disabled = false;
                    chatInput.focus();
                });
            };

            // Event listeners
            sendBtn.addEventListener("click", handleSend);
            chatInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") {
                    handleSend();
                }
            });
        });
    </script>
</body>

</html>
