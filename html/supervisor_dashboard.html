<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
            margin: 0;
            padding: 0;
            color: #333;
        }
        .dashboard-wrapper {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
            color: #102a43;
        }
        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        thead {
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
        }
        th {
            padding: 16px 24px;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.05em;
        }
        td {
            padding: 16px 24px;
            border-bottom: 1px solid #e2e8f0;
            color: #334155;
            font-size: 14px;
        }
        tbody tr:hover {
            background-color: #f1f5f9;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn-logout {
            padding: 10px 20px;
            background: #ef4444;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn-logout:hover {
            background: #dc2828;
        }
        
        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal {
            background: white;
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 30px;
            position: relative;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .modal-header h2 {
            margin: 0;
            font-size: 20px;
            color: #0f172a;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #64748b;
            cursor: pointer;
        }
        .session-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .session-card h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #334155;
            display: flex;
            justify-content: space-between;
        }
        .risk-badge {
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .risk-high { background: #fee2e2; color: #991b1b; }
        .risk-medium { background: #fef3c7; color: #92400e; }
        .risk-low { background: #dcfce3; color: #166534; }
        
        .session-detail {
            font-size: 14px;
            color: #475569;
            line-height: 1.5;
            margin-top: 10px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="dashboard-wrapper">
        <div class="header">
            <h1>Supervisor Dashboard</h1>
            <a href="begin.html" class="btn-logout">Logout</a>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Origin</th>
                    </tr>
                </thead>
                <tbody id="user-table-body">
                    <!-- Data will be populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal for Session Details -->
    <div class="modal-overlay" id="session-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-user-title">User Sessions</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="session-content">
                <!-- Session details will be loaded here -->
                <div class="empty-state">Loading sessions...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000";

        // Fetch and render users
        async function loadUsers() {
            try {
                const response = await fetch(`${API_URL}/api/users`);
                const data = await response.json();
                
                if (data.status === "success" && data.users) {
                    renderUsers(data.users);
                } else {
                    console.error("Failed to load users:", data.error);
                }
            } catch (error) {
                console.error("Error fetching users:", error);
                document.getElementById('user-table-body').innerHTML = `
                    <tr><td colspan="5" class="empty-state">Error loading user data. Please ensure the backend is running.</td></tr>
                `;
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';
            
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No users found.</td></tr>';
                return;
            }

            users.forEach(user => {
                const tr = document.createElement('tr');
                tr.onclick = () => openSessionDetails(user);
                
                tr.innerHTML = `
                    <td>${user.userid || '-'}</td>
                    <td>${user.name || '-'}</td>
                    <td>${user.age || '-'}</td>
                    <td>${user.gender || '-'}</td>
                    <td>${user["where it come from"] || '-'}</td>
                `;
                
                // Attach user object to the row for click handler
                tr.onclick = function() {
                    openSessionDetails(user);
                };
                
                tbody.appendChild(tr);
            });
        }

        async function openSessionDetails(user) {
            const modal = document.getElementById('session-modal');
            const content = document.getElementById('session-content');
            const title = document.getElementById('modal-user-title');
            
            title.textContent = `Sessions for ${user.name || user.userid}`;
            content.innerHTML = '<div class="empty-state">Loading...</div>';
            modal.style.display = 'flex';
            
            if (!user.chat_ids || user.chat_ids.length === 0) {
                content.innerHTML = '<div class="empty-state">No sessions found for this user.</div>';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/sessions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_ids: user.chat_ids })
                });
                
                const data = await response.json();
                
                if (data.status === "success") {
                    renderSessions(data.sessions);
                } else {
                    content.innerHTML = `<div class="empty-state" style="color: #ef4444">Error: ${data.error}</div>`;
                }
            } catch (error) {
                content.innerHTML = `<div class="empty-state" style="color: #ef4444">Error fetching sessions.</div>`;
            }
        }

        function renderSessions(sessions) {
            const content = document.getElementById('session-content');
            
            if (sessions.length === 0) {
                content.innerHTML = '<div class="empty-state">No session details found.</div>';
                return;
            }

            let html = '';
            sessions.forEach(session => {
                // Determine badge class
                let badgeClass = 'risk-low';
                const risk = (session.risk_level || '').toLowerCase();
                if (risk === 'high') badgeClass = 'risk-high';
                else if (risk === 'medium') badgeClass = 'risk-medium';
                
                html += `
                    <div class="session-card">
                        <h3>
                            ${session.sympton || 'Unknown Symptom'}
                            <span class="risk-badge ${badgeClass}">${session.risk_level || 'Unknown'}</span>
                        </h3>
                        <div class="session-detail">
                            <strong>Chat ID:</strong> ${session.chat_id}<br><br>
                            ${session.detail || 'No details provided.'}
                        </div>
                    </div>
                `;
            });
            
            content.innerHTML = html;
        }

        function closeModal() {
            document.getElementById('session-modal').style.display = 'none';
        }

        // Close modal when clicking outside
        document.getElementById('session-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Initial load
        window.onload = loadUsers;
    </script>
</body>
</html>
